<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#151626">
  <title>ASMR MUSOU | バリぷにラッシュ</title>
  <meta name="description" content="斬って、割って、つぶして、音がごほうび。45秒のASMR無双！">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="shell" aria-label="ASMR無双 ゲーム">
    <canvas id="game" width="720" height="1280" aria-label="ASMR無双 プレイ画面"></canvas>
    <div id="hud" class="hud hidden" aria-live="polite">
      <div class="hud-head"><div class="brand">ASMR <b>無双</b></div><button id="sound" class="mini" aria-label="音と振動のオンオフ" aria-pressed="true" title="音と振動 ON">🔊</button></div>
      <div class="hud-stats"><div><span class="tiny">SCORE</span><strong id="score">000000</strong></div><div class="timer"><span class="tiny">TIME</span><strong id="time">45</strong><span class="tiny">SEC</span></div></div>
      <div class="progress"><div id="progress-fill"></div></div>
      <div class="hud-bottom"><span id="wave">WAVE 1 / 3</span><span id="combo">JUST RELAX ✦</span></div>
    </div>
    <section id="menu" class="overlay">
      <div class="tiny-eyebrow">SOUND IS THE REWARD</div>
      <div class="logo">ASMR<br><span>無 双</span></div>
      <div class="tagline">バリッ。ぷにっ。ぱりんっ。</div>
      <div class="decor" aria-hidden="true"><i>✦</i><i>●</i><i>✴</i></div>
      <p class="intro">敵はみんな、気持ちいい素材。<br>45秒、好きなだけ割りまくろう。</p>
      <button id="start" class="primary">さわってスタート <span>▶</span></button>
      <div class="instructions"><span>☝ タップ：割る</span><span>〰 なぞる：連続斬り</span><span>◉ 長押し：むぎゅっ</span></div>
      <p class="footnote">小さめの音量で · 音と振動は 🔊 で切替</p>
    </section>
    <div class="rotate-message" aria-live="polite"><span class="rotate-icon">↻</span><strong>縦向きにしてね</strong><small>このゲームは縦画面で遊べます</small></div>
    <section id="result" class="overlay hidden">
      <div class="tiny-eyebrow">TIME UP!</div>
      <div class="result-title">すっきり！</div>
      <div class="result-card"><span>CRUNCH SCORE</span><strong id="final-score">0</strong><div class="result-stats"><div><small>CRACKED</small><b id="final-kills">0</b></div><div><small>MAX COMBO</small><b id="final-combo">0</b></div></div></div>
      <p class="intro">音が、いちばんの戦利品。</p>
      <button id="retry" class="primary">もう一回むそう！ <span>↻</span></button>
      <div class="instructions"><span>45秒で何体割れるかな？</span></div>
    </section>
  </main>
  <script src="audio.js" defer></script>
  <script src="game.js" defer></script>
</body>
</html>

<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0c171d"><title>ASMR素材研究所 · R0-A</title><link rel="stylesheet" href="lab/lab.css">
<script defer src="lab/slice.js"></script><script defer src="lab/events.js"></script><script defer src="lab/assets-bundle.js"></script><script defer src="lab/assets.js"></script><script defer src="lab/gl.js"></script><script defer src="lab/materials/wax.js"></script><script defer src="lab/materials/jelly.js"></script><script defer src="lab/audio.js"></script><script defer src="lab/main.js"></script></head>
<body><main id="lab">
<canvas id="scene" width="720" height="1280" aria-label="素材を指やマウスで斬る実験エリア"></canvas>
<header><div class="eyebrow">MATERIAL STUDIES / 03</div><h1>ASMR素材研究所</h1><p id="hint">すっと斬る。そっと触れて、殻を割る。</p></header>
<div id="status" role="status" aria-live="polite"></div>
<footer>
<div class="tools"><label class="sr" for="material">素材</label><select id="material"><option value="wax">01 ロウ</option><option value="jelly">02 ゼリー</option></select><button id="spawn">1体を置く</button><button id="horde">群れ</button><label class="count"><span>N</span><input id="count" type="number" value="40" min="1" max="80" aria-label="群れの数"></label><button id="reset">リセット</button></div>
<div class="tools secondary"><button id="slow" aria-pressed="false">¼ スロー</button><button id="pause" aria-pressed="false">一時停止</button><button id="step">1コマ</button><button id="wire" aria-pressed="false">線を見る</button><button id="sound" aria-pressed="true">音 ON</button></div>
<output id="metrics">準備中…</output><div class="keys">1 / 2 素材　N 追加　H 群れ　S スロー　Space 停止　. コマ送り　D 線　R リセット</div>
</footer><div id="error" role="alert" hidden></div>
</main></body></html>

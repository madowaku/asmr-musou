<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="theme-color" content="#120f1f"><link rel="icon" href="data:,">
<meta name="robots" content="noindex,nofollow"><title>ASMR MUSOU · SOUND STAGES v0.6</title><link rel="stylesheet" href="combat/combat.css"><link rel="stylesheet" href="feel/feel.css"><link rel="stylesheet" href="stages/stages.css">
<script defer src="lab/slice.js"></script><script defer src="lab/events.js"></script><script defer src="lab/assets-bundle.js"></script><script defer src="lab/outlines.js"></script><script defer src="lab/profiles.js"></script><script defer src="lab/timing.js"></script><script defer src="lab/assets.js"></script><script defer src="lab/gl.js"></script>
<script defer src="lab/materials/wax.js"></script><script defer src="lab/materials/jelly.js"></script><script defer src="lab/materials/studies.js"></script>
<script defer src="lab/audio/dsp.js"></script><script defer src="lab/audio/temporal.js"></script><script defer src="lab/audio/engine.js"></script><script defer src="lab/audio/audio.js"></script><script defer src="lab/caps.js"></script>
<script defer src="combat/world.js"></script><script defer src="combat/formations.js"></script><script defer src="feel/heroes.js"></script><script defer src="feel/sfx.js"></script><script defer src="stages/stages.js"></script><script defer src="stages/game.js"></script>
</head>
<body><main id="arena">
<canvas id="scene" width="720" height="1280" aria-label="戦闘エリア。触った場所を攻撃する"></canvas>
<div id="pops" aria-hidden="true"></div>
<div id="hud" hidden>
  <div class="bar"><div id="time"></div></div>
  <div id="stg" class="stg"></div>
  <div class="row"><span id="cls"></span><span class="kills"><b id="kills">0</b> 撃破</span><span id="combo"></span><button id="mute" aria-label="音のオンオフ">🔊</button></div>
  <div id="upmeter" class="upmeter"><small>次の強化</small><div><i id="upbar"></i></div></div>
  <div id="lv" class="lv"></div>
  <div id="banner"></div>
  <div id="intro" class="intro" hidden></div>
  <div id="help"></div>
</div>
<section id="loading" class="overlay"><p>準備中…</p></section>
<section id="select" class="overlay" hidden>
  <div class="eyebrow">ASMR MUSOU · SOUND STAGES v0.6</div>
  <h1>ステージが進むほど、<br>音が増えていく。</h1>
  <p class="lead">1ステージに、新しい素材がひとつ。まずその音だけを聴いて、だんだん知っている音と混ざっていく。</p>
  <div id="stages" class="stages"></div>
  <p id="stage-lead" class="stagelead"></p>
  <div class="cards">
    <button id="pick-slasher" class="card slasher"><b>SLASHER</b><small>大剣士</small><span>スワイプした向きに、群れごと真っ二つ。</span><em></em></button>
    <button id="pick-crusher" class="card crusher"><b>CRUSHER</b><small>拳闘士</small><span>タップした敵へ踏み込んで殴る。連打でラッシュ。</span><em></em></button>
    <button id="pick-caster" class="card caster"><b>CASTER</b><small>魔法使い</small><span>タップした場所に魔法。長押しで吸い込んで弾ける。</span><em></em></button>
  </div>
  <button id="zukan" class="ghost zbtn">ASMR図鑑</button>
  <p class="how">60秒・途中で2回強化・最後は素材の巨大ボス。イヤホン推奨。</p>
</section>
<section id="upgrade" class="overlay up" hidden>
  <div class="eyebrow">POWER UP <span id="up-n">1</span>/2</div>
  <h2>強化を選ぶ</h2>
  <p class="lead">時間は止まっています。ゆっくり選んでください。</p>
  <div id="up-cards" class="upcards"></div>
</section>
<section id="result" class="overlay" hidden>
  <div id="r-eyebrow" class="eyebrow">RESULT</div><h2 id="r-title">すっきり！</h2>
  <div id="r-stats" class="stats"></div>
  <div id="r-mats" class="mats"></div>
  <div id="r-growth" class="growth"></div>
  <p id="r-next" class="next"></p>
  <button id="next-stage" class="primary"></button>
  <button id="again" class="ghost">同じステージをもう一回</button>
  <div class="switch"><span>キャラを変えて同じステージ</span><button id="again-slasher">SLASHER</button><button id="again-crusher">CRUSHER</button><button id="again-caster">CASTER</button></div>
  <button id="to-stages" class="ghost">ステージを選ぶ</button>
</section>
<div id="error" role="alert" hidden></div>
</main></body></html>

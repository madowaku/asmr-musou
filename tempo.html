<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff1dc"><link rel="icon" href="data:,">
<meta name="robots" content="noindex,nofollow"><title>ASMR MUSOU · CRUNCH LINE v0.7 TEMPO</title><link rel="stylesheet" href="combat/combat.css"><link rel="stylesheet" href="feel/feel.css"><link rel="stylesheet" href="crunch/crunch.css">
<script defer src="lab/slice.js"></script><script defer src="lab/events.js"></script><script defer src="lab/assets-bundle.js"></script><script defer src="lab/outlines.js"></script><script defer src="lab/profiles.js"></script><script defer src="lab/timing.js"></script><script defer src="lab/assets.js"></script><script defer src="lab/gl.js"></script>
<script defer src="lab/materials/wax.js"></script><script defer src="lab/materials/jelly.js"></script><script defer src="lab/materials/studies.js"></script>
<script defer src="lab/audio/dsp.js"></script><script defer src="lab/audio/temporal.js"></script><script defer src="lab/audio/engine.js"></script><script defer src="lab/audio/audio.js"></script><script defer src="lab/caps.js"></script>
<script defer src="combat/world.js"></script><script defer src="combat/formations.js"></script><script defer src="feel/heroes.js"></script><script defer src="feel/sfx.js"></script><script defer src="crunch/crunch.js"></script><script defer src="tempo/game.js"></script>
</head>
<body><main id="arena">
<canvas id="scene" width="720" height="1280" aria-label="戦闘エリア。上から来る敵を、下のラインに届く前に壊す"></canvas>
<div id="pops" aria-hidden="true"></div>
<div id="hud" hidden>
  <div class="bar"><div id="time"></div></div>
  <div class="row"><span id="cls"></span><span class="kills"><b id="kills">0</b> 撃破</span><span id="breach-box" class="breach">侵入 <b id="breach">0</b></span><span id="combo"></span><button id="mute" aria-label="音のオンオフ">🔊</button></div>
  <div id="upmeter" class="upmeter"><small>次の強化</small><div><i id="upbar"></i></div></div>
  <div id="lv" class="lv"></div>
  <div id="banner"></div>
  <div id="help"></div>
</div>
<section id="loading" class="overlay"><p>準備中…</p></section>
<section id="select" class="overlay" hidden>
  <div class="eyebrow">ASMR MUSOU · CRUNCH LINE v0.7 TEMPO</div>
  <h1>一つを味わう。<br>やがて、全部を砕く。</h1>
  <p class="lead">上から素材の敵がやってくる。下のラインに届く前に壊そう。<br>最初は同じ敵を何度も叩いて削る。強化するたび、一撃で、まとめて。</p>
  <div class="cards">
    <button id="pick-slasher" class="card slasher"><b>SLASHER</b><small>大剣士</small><span>横に大きく斬る。並んだ群れをまとめて切断。</span><em></em></button>
    <button id="pick-crusher" class="card crusher"><b>CRUSHER</b><small>拳闘士</small><span>殴って削り、後ろの群れへ押し返す。</span><em></em></button>
    <button id="pick-caster" class="card caster"><b>CASTER</b><small>魔法使い</small><span>広く砕く。長押しで吸い込んで一斉粉砕。</span><em></em></button>
  </div>
  <p class="how">60秒。ラインを越えられても終わらない。侵入ゼロなら PERFECT。イヤホン推奨。</p>
</section>
<section id="upgrade" class="overlay up" hidden>
  <div class="eyebrow">POWER UP <span id="up-n">1</span>/2</div>
  <h2>強化を選ぶ</h2>
  <p class="lead">時間は止まっています。ゆっくり選んでください。</p>
  <p id="up-power" class="uppower"></p>
  <div id="up-cards" class="upcards"></div>
</section>
<section id="result" class="overlay" hidden>
  <div class="eyebrow">RESULT</div><h2 id="r-title">すっきり！</h2>
  <p id="r-defense" class="defense"></p>
  <div id="r-stats" class="stats"></div>
  <div id="r-growth" class="growth"></div>
  <button id="again" class="primary">もう一回</button>
  <div class="switch"><span>キャラを変える</span><button id="again-slasher">SLASHER</button><button id="again-crusher">CRUSHER</button><button id="again-caster">CASTER</button></div>
  <button id="newfield" class="ghost">別の戦場（敵の出方を変える）</button>
</section>
<div id="error" role="alert" hidden></div>
</main></body></html>
